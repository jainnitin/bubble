# Self-update settings, sourced by scripts/bundle.sh and scripts/release.sh.
# Change GITHUB_REPO once the public repo exists; everything else derives from it.

# >>> PLACEHOLDER: set to "<owner>/<repo>" of the public GitHub repo. <<<
GITHUB_REPO="jainnitin/bubble"

# Sparkle appcast. Each GitHub Release carries an appcast.xml asset, and
# /releases/latest/download/ always redirects to the newest non-prerelease one.
SU_FEED_URL="${SU_FEED_URL:-https://github.com/$GITHUB_REPO/releases/latest/download/appcast.xml}"

# EdDSA public key. The private half lives in the login Keychain (account below) and in
# the SPARKLE_ED_PRIVATE_KEY secret of the GitHub "release" environment. Never put the
# private key here.
SU_PUBLIC_ED_KEY="jyuEV7nU8hjatJFWdAXJkhqB1iKsIOnl6thxNLTYukw="
SPARKLE_KEY_ACCOUNT="bubble"
