# Push a tag like v0.2.0 to build, sign, notarize and publish a release that existing installs update to.
# Needs these secrets in the GitHub Environment "release" (the Apple ones match ~/code/keel's):
#   SPARKLE_ED_PRIVATE_KEY   update-signing key
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD             Developer ID Application certificate
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID   App Store Connect key (notary)
# Secrets go in Settings >
# Environments > release > Environment secrets; see README "Releasing"). Give that environment a
# deployment rule limited to tags matching v*.*.* and, ideally, a required reviewer, so no other
# branch, workflow or pull request can read the update-signing key.
#
# Supply chain: every action is pinned to a full commit SHA (the comment names its tag). To bump
# one: gh api repos/<owner>/<action>/git/ref/tags/<tag>  (dereference annotated tags with
# gh api repos/<owner>/<action>/git/tags/<sha>), then update the SHA and the comment.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Builds and signs the update. Holds the signing key, but only a read-only token.
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        # Instead of a third-party setup action: use the newest stable Xcode on the runner image.
        run: |
          XCODE=$( (ls -d /Applications/Xcode_*.app 2>/dev/null || true) | (grep -v -i beta || true) | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          echo "Using $XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Check configuration
        run: |
          . ./updates.conf
          if [ "$GITHUB_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::updates.conf GITHUB_REPO is '$GITHUB_REPO' but this repo is '$GITHUB_REPOSITORY'. Fix it so the feed URL points here."
            exit 1
          fi
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::Secret SPARKLE_ED_PRIVATE_KEY is not set in the 'release' environment."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#v}" != "$(tr -d ' \n' < VERSION)" ]; then
            echo "::warning::Tag $GITHUB_REF_NAME doesn't match VERSION file; building as ${GITHUB_REF_NAME#v}."
          fi
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPW="$(uuidgen)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "::error::No Developer ID Application identity in MACOS_CERT_P12_BASE64."; exit 1; }
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "SIGN_KEYCHAIN=$KEYCHAIN"
            echo "SIGN_IDENTITY=$IDENTITY"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"

      - name: Resolve packages from Package.resolved only
        run: swift package --force-resolved-versions resolve

      - name: Build, sign update, generate appcast
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Remove signing keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/Bubble-*.zip
            dist/appcast.xml
          if-no-files-found: error
          retention-days: 7

  publish:
    # Creates the GitHub Release. Has a write token, but never sees the signing key and
    # runs none of the repository's code.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Publish GitHub Release
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/Bubble-$V.zip" dist/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --title "Bubble $V" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
